name: M3 CI Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  test-build-publish:

    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc

      - name: Configure DVC authentication
        run: |
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify --local dagshub password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Check DVC remote
        run: |
          dvc remote list
          dvc remote default
      - name: Configure DVC remote
        run: |
          dvc remote modify dagshub --local auth basic
          dvc remote modify dagshub --local user "${{ secrets.DAGSHUB_USERNAME }}"
          dvc remote modify dagshub --local password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull model from DVC
        run: |
          dvc pull models/baseline_cnn.pt.dvc -v
      - name: Pull model from DVC
        run: |
          dvc pull models/baseline_cnn.pt.dvc -v

      - name: Run pytest
        run: |
          pytest -v

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api:latest \
            .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api:latest